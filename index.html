<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WYRE | Live Sourcing Engine</title>
    <style>
        /* --- PREMIUM CINEMATIC INTERFACE --- */
        :root {
            --accent: #00d4ff;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 212, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 212, 255, 0.08) 0px, transparent 50%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 850px;
            padding: 100px 20px;
            text-align: center;
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -3px;
            margin: 0;
            background: linear-gradient(to bottom, #fff 30%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-wrapper {
            background: var(--glass);
            backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 24px;
            display: flex;
            margin-top: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1rem;
            padding: 15px 25px;
            outline: none;
        }

        .track-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 0 35px;
            border-radius: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .track-btn:hover {
            background: var(--accent);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        #results { margin-top: 60px; }

        .result-card {
            display: flex;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            border-radius: 24px;
            padding: 25px;
            text-align: left;
            align-items: center;
        }

        .product-img {
            width: 100px;
            height: 100px;
            background-size: cover;
            background-position: center;
            border-radius: 18px;
            margin-right: 25px;
            border: 1px solid var(--border);
        }

        .price-main { font-size: 1.8rem; font-weight: 800; color: var(--accent); }
        .shard { position: fixed; background: #fff; width: 12px; height: 1px; z-index: 9999; }
    </style>
</head>
<body>

    <div class="container">
        <h1>WYRE</h1>
        <div class="search-wrapper">
            <input type="text" id="urlInput" placeholder="Paste product link here...">
            <button class="track-btn" onclick="processSearch()">TRACK</button>
        </div>
        <div id="results"></div>
    </div>

    <script>
        async function processSearch() {
            const inputUrl = document.getElementById('urlInput').value;
            const container = document.getElementById('results');
            shatter(); // Visual effect

            if (!inputUrl) return;

            container.innerHTML = `<div style="color:var(--accent); font-weight:bold; animation: pulse 1s infinite;">SCRAPING LIVE MARKET DATA...</div>`;

            // 1. Extract Product Name from URL Slug
            const productName = extractNameFromUrl(inputUrl);
            
            // 2. Fetch Live Data via Keyless Proxy
            try {
                // Using eBay for reliable scraping (Amazon blocks proxies instantly)
                const searchTarget = `https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(productName)}+alternative&_sop=15`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(searchTarget)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // 3. Parse the DOM
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, "text/html");
                
                // Find top 2 listings in the raw HTML
                const items = doc.querySelectorAll('.s-item__wrapper').slice(1, 3); 
                
                if (items.length === 0) throw new Error("No alternatives found or site blocked proxy.");

                let htmlContent = '';
                items.forEach(item => {
                    const title = item.querySelector('.s-item__title')?.innerText || "Alternative Match";
                    const priceText = item.querySelector('.s-item__price')?.innerText || "Price Not Found";
                    const imgUrl = item.querySelector('.s-item__image-img')?.src || "";
                    const itemLink = item.querySelector('.s-item__link')?.href || "#";

                    // Currency detection (matches $, £, €, PKR, etc.)
                    const currencyMatch = priceText.match(/[^0-9\.,]+/);
                    const currency = currencyMatch ? currencyMatch[0].trim() : '$';

                    // 4. Construct Affiliate Redirect (Your 2% Cut)
                    const affiliateID = "wyre-2026";
                    const finalLink = `${itemLink}&customid=${affiliateID}`;

                    htmlContent += `
                        <div class="result-card">
                            <div class="product-img" style="background-image: url('${imgUrl}')"></div>
                            <div style="flex:1">
                                <h3 style="margin:0">${title}</h3>
                                <p style="color:#777; font-size:0.9rem;">Live market extraction. Currency verified.</p>
                                <div class="price-main">${priceText}</div>
                            </div>
                            <button class="track-btn" style="height:50px" onclick="window.open('${finalLink}', '_blank')">BUY</button>
                        </div>
                    `;
                });

                container.innerHTML = htmlContent;

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div style="color:red;">Target marketplace blocked the connection. Try a different product link.</div>`;
            }
        }

        // Logic to strip the product name out of a raw URL
        function extractNameFromUrl(url) {
            try {
                const urlObj = new URL(url);
                const pathParts = urlObj.pathname.split('/').filter(p => p.length > 3);
                let potentialName = pathParts[0] || "cheaper alternative";
                return potentialName.replace(/-/g, ' ');
            } catch {
                return "cheaper alternative";
            }
        }

        function shatter() {
            for (let i = 0; i < 15; i++) {
                const s = document.createElement('div');
                s.className = 'shard';
                s.style.left = '50%'; s.style.top = '50%';
                document.body.appendChild(s);
                const angle = Math.random() * Math.PI * 2;
                const dist = 200 + Math.random() * 300;
                s.animate([
                    { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) rotate(450deg)`, opacity: 0 }
                ], 800).onfinish = () => s.remove();
            }
        }
    </script>
</body>
</html>
